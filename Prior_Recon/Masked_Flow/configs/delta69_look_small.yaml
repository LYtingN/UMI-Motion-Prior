skeleton:
  name: g1_delta69
  n_total_joints: 69
  upper_body_global_indices: null
  wrist_local_indices: []

# ── Motion representation ─────────────────────────────────────────────────────
motion:
  joint_repr: dof
  seq_len: 10
  fps: 30
  window_stride: 8
  normalize: false

# ── Primitive rollout ─────────────────────────────────────────────────────────
primitive:
  enabled: true
  history_len: 2
  future_len: 8
  num_primitives: 4
  segment_stride: 8
  rollout_start_ratio: 0.02
  rollout_end_ratio: 0.15
  rollout_max_prob: 1.0
  val_rollout: true

# ── Training ──────────────────────────────────────────────────────────────────
# Aligned with delta69_small: small backbone leaves headroom for a 2x batch.
train:
  lr: 4.0e-4          # sqrt-scaled for 4096 global batch (2.8e-4 @ 2048 -> x sqrt2)
  weight_decay: 1.0e-4
  # Global batch. On 4-GPU DDP this splits to 1024/rank, where the transformer
  # GEMMs are large enough to leave the launch-bound regime (+~58% throughput
  # vs 512/rank; small 39M model fits easily). Must stay divisible by GPU count.
  batch_size: 4096
  max_microbatch_size: 4096 # OOM guard auto-halves if needed
  num_workers: 8         # per-rank; 4 GPUs x 8 = 32 workers (shm=160G, 128 CPU)
  gpu_memory_fraction: 0.85
  n_epochs: 150
  grad_clip: 1.0
  ema_decay: 0.999
  warmup_epochs: 3          # ~2% of training (150 epochs)
  val_split: 0.1
  log_interval: 50
  ckpt_dir: checkpoints/Prior_Recon/masked_flow_delta69_look_small

# ── Model architecture ────────────────────────────────────────────────────────
# small backbone: 12 * 12 * 512^2 = 37.7M  (full look was 768 -> 85M)
# head_dim = 512/8 = 64  (与 full 版一致)
hidden_dim: 512
n_layers: 12
n_heads: 8
dropout: 0.1
time_emb_dim: 256
ode_steps: 32

# ── EE conditioning ───────────────────────────────────────────────────────────
use_ee_pos: true
use_ee_height_anchor: true
use_ee_vel: true
# EE-as-state: append 18 pinned EE pose columns (2 hands x pos3+rot6d) to the
# delta69 features. Columns are hard-imposed via obs_mask at train and sample
# time; identical values to s_ee[..., :18] (segment_anchored_v1).
ee_state_dim: 0

# ── Flow matching ─────────────────────────────────────────────────────────────
use_logit_normal_t: true
logit_normal_sigma: 1.0
per_frame_noise: true

# ── Loss weights ──────────────────────────────────────────────────────────────
loss:
  flow_weight: 1.0
  recon_weight: 0.15
  velocity_weight: 0.15
  leg_joint_weight: 0.5
  root_weight: 2
  accel_weight: 0.0
  contact_weight: 0.05
  body_trans_weight: 0.05
  body_rot_weight: 0.01
  ee_pos_weight: 0.2
  ee_rot_weight: 0.05
  ee_cond_pos_weight: 2.0
  ee_cond_rot_weight: 0.2
  dof_pos_weight: 0.03
  dof_vel_weight: 1e-5
  foot_contact_weight: 0.05
  drift_yaw_weight: 0.05
  drift_xy_weight: 0.5
  root_curriculum_start_mult: 1.5
  root_curriculum_end_ratio: 0.10
  ee_curriculum_start_ratio: 0.02
  ee_curriculum_end_ratio: 0.15
  smooth_weight: 0.001
  quantize_rot_weight: 0.0
  quantize_trans_weight: 0.0

# ── EE lookahead ──────────────────────────────────────────────────────────────
# Condition each primitive on 16 EE frames (0.53s) beyond its window end,
# downsampled to 8 preview tokens. Training randomly truncates the preview so
# short-horizon deployment states stay in-distribution.
lookahead_len: 16
lookahead_stride: 2
