skeleton:
  name: g1_delta69
  n_total_joints: 69
  upper_body_global_indices: null
  wrist_local_indices: []

# ── Motion representation ─────────────────────────────────────────────────────
motion:
  joint_repr: dof
  seq_len: 10
  fps: 30
  window_stride: 8
  normalize: false

# ── Primitive rollout ─────────────────────────────────────────────────────────
primitive:
  enabled: true
  history_len: 2
  future_len: 8
  num_primitives: 4
  segment_stride: 8
  rollout_start_ratio: 0.02
  rollout_end_ratio: 0.15
  rollout_max_prob: 1.0
  val_rollout: true

# ── Training ──────────────────────────────────────────────────────────────────
train:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  batch_size: 768
  max_microbatch_size: 768
  num_workers: 6
  gpu_memory_fraction: 0.90
  n_epochs: 250
  grad_clip: 1.0
  ema_decay: 0.999
  warmup_epochs: 5
  val_split: 0.1
  log_interval: 50
  ckpt_dir: checkpoints/Prior_Recon/masked_flow_delta69_full

# ── Model architecture ────────────────────────────────────────────────────────
hidden_dim: 768
n_layers: 12
n_heads: 12
dropout: 0.1
time_emb_dim: 256
ode_steps: 32

# ── EE conditioning ───────────────────────────────────────────────────────────
use_ee_pos: true
use_ee_height_anchor: true
use_ee_vel: true

# ── Flow matching ─────────────────────────────────────────────────────────────
use_logit_normal_t: true
logit_normal_sigma: 1.0

# ── Loss weights ──────────────────────────────────────────────────────────────
loss:
  flow_weight: 1.0
  recon_weight: 0.15
  velocity_weight: 0.15
  leg_joint_weight: 0.5
  root_weight: 2
  accel_weight: 0.0
  contact_weight: 0.05
  body_trans_weight: 0.05
  body_rot_weight: 0.01
  ee_pos_weight: 0.2
  ee_rot_weight: 0.05
  ee_cond_pos_weight: 2.0
  ee_cond_rot_weight: 0.2
  dof_pos_weight: 0.03
  dof_vel_weight: 1e-5
  foot_contact_weight: 0.05
  drift_yaw_weight: 0.05
  drift_xy_weight: 0.5
  root_curriculum_start_mult: 1.5
  root_curriculum_end_ratio: 0.10
  ee_curriculum_start_ratio: 0.02
  ee_curriculum_end_ratio: 0.15
  smooth_weight: 0.001
  quantize_rot_weight: 0.0
  quantize_trans_weight: 0.0