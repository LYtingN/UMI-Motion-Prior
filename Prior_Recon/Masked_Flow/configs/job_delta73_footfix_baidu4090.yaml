config_version: 1
cluster: baidu_4090
num_gpus: 16
image: "ai-base:ubuntu22.04-sim5.0.0-lab_MD2.2.1-ray2.52.0-cu12.8_devel-v1.4"

git_workspace:
  token: GH_PAT
  repos:
    - repo_url: https://github.com/LYtingN/Motion_Prior_Manipualtion.git
      commit_sha: main

pip_packages:
  - pyyaml          # configs/load_config.py: config_from_yaml
  - numpy
  - pandas          # dataset/delta_dataset.py 懒加载 (LeRobot/CSV 路径才用)
  - tensorboard     # trainer 里 SummaryWriter 日志(否则静默跳过)
pip_directories: []
py_modules: []
# train_delta_flow.py 内部 _find_repo_root() 会自己把仓库根插入 sys.path
# 以解析 pipeline.Prior_Recon.Masked_Flow.*;entry_module 相对仓库根解析,
# 故 py_paths 指向仓库根即可。
py_paths: ["."]
log_folder: "logs"

tasks:
  - name: masked_flow_delta73_footfix
    type: torch_trainer.train
    run_name: masked_flow_delta73_footfix_baidu4090
    # 由平台启动器托管分布式(自动注入 RANK/WORLD_SIZE/LOCAL_RANK/MASTER_ADDR
    # 铺满全部 16 卡);trainer 用 utils/distributed.setup_distributed() 直接读这些
    # env 变量、init_process_group(env://)、手动 all_reduce 梯度(非 DDP wrapper、
    # 非 accelerate),所以无需手写 torchrun / accelerate launch。
    entry_module: pipeline/Prior_Recon/Masked_Flow/scripts/train_delta_flow.py
    args:
      # 路径相对 cwd(=仓库根)解析
      - "--config"
      - "pipeline/Prior_Recon/Masked_Flow/configs/delta73_footfix.yaml"
      # delta 特征根:eason.nai 已失效,正确路径在 eason.er(23962 个 npz)
      - "--feat-root"
      - "/data/nas_ray/home/eason.er/train_delta_feat_v3"
      # 4090=24GB,单进程显存上限(与 config train.gpu_memory_fraction 一致)
      - "--gpu-memory-fraction"
      - "0.85"
      # ckpt 落 NAS 持久化(不落 pod 内易失的仓库根);传 --ckpt-dir 则跳过日期后缀
      - "--ckpt-dir"
      - "/data/nas_ray/home/eason.er/checkpoints/Prior_Recon/masked_flow_delta73_footfix_baidu4090"
      # config.train.batch_size=8192 是【全局】batch;dataloader 按 world_size 切分,
      # 8192/16=512/卡(必须整除,16 整除 8192 ✓),不覆盖即保持全局 batch 不变。

os_env_vars:
  GH_PAT: "REPLACE_WITH_GITHUB_PAT"
  WANDB_MODE: "offline"
  # 每 worker 的 in-RAM 源文件 LRU 缓存上限。数据集 23962 个 DEFLATE 压缩 npz,
  # 随机访问下小缓存会每 epoch 反复解压 -> epoch 时间翻倍(IO-bound,非 GPU-bound)。
  # 保持满缓存(100000 >> 23962)使 epoch 2+ 零解压。
  # 内存占用 ~ 16 卡 x num_workers(=2) x ~9GB ≈ 288GB;若该 4090 节点内存不足
  # 触发 OOM-kill,再调小此值或 --num-workers。
  FEAT_CACHE_MAX_FILES: "100000"
